  <section id="contact">
    <h2>Contact Us</h2>
    <p>Email: forthhills@.gmail.com | Phone: +234-705-258-8704 or +234-803-441-6572</p>
  </section><br><br>

    <div class="contact-form contact-card">
                    <h3>Send us a Message</h3>
                     <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" novalidate>
                           <input type="hidden" name="access_key" value="22b0c187-7f5e-48e5-91cf-d3481d9cd44f">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" name="name" placeholder="Your full name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone" placeholder="e.g., 08012345678 or +2348012345678" pattern="^(?:0\d{10}|\+234\d{10})$" title="Use format 08012345678 or +2348012345678 (no spaces)">
                            </div>
                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input type="text" id="subject" name="subject" placeholder="Subject" required>
                            </div>
                            <div class="form-group full-width">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" placeholder="Your message" rows="5" required></textarea>
                            </div>
                        </div>
                        
                        <div id="form-status" role="status" aria-live="polite"></div>
                        <button type="submit" id="submit-btn" class="btn">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
